      .soon {

      .soon img {

        opacity: 0.6;
      }
      .soon::before,
      .soon::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        aspect-ratio: 1;
        background: url(../assets/coming-soon.png) center / 111px 51px no-repeat;
        image-rendering: pixelated;
      }
      .soon::after {
        background-image: url(../assets/coming-soon-flash.png);
        animation: flash 1s steps(1) infinite;
      }
      @keyframes flash {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .soon::after {
          display: none;
        }
      }

      /* The home page's sky, behind everything. */
      #sky {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      #sky div {
        position: absolute;
        left: 0;
        top: 0;

    <script>
      // Clouds drift across and butterflies flutter through, as on the home
      // page (src/smilers.js), drawn here as plain elements behind the links.
      (() => {
        const sky = document.getElementById("sky");
        const rand = (min, max) => min + Math.random() * (max - min);
        const add = (className) => {
          const el = document.createElement("div");
          el.className = className;
          sky.appendChild(el);
          return el;
        };
        const draw = (thing, flip) => {
          thing.el.style.transform = `translate(${Math.round(thing.x)}px, ${Math.round(thing.y)}px) scaleX(${flip})`;
        };

        const clouds = [];
        const placeCloud = (cloud, x) => {
          cloud.x = x;
          cloud.y = rand(0, innerHeight - 64);
          cloud.speed = rand(15, 40);
          // The higher the cloud, the earlier its frame of the sheet.
          const frame = Math.min(3, Math.floor((cloud.y / innerHeight) * 4));
          cloud.el.style.backgroundPositionX = `${-frame * 128}px`;
        };
        const cloudCount = innerWidth < 600 ? 5 : Math.round(rand(7, 10));
        for (let i = 0; i < cloudCount; i++) {
          const cloud = { el: add("cloud"), flip: Math.random() < 0.5 ? -1 : 1 };
          placeCloud(cloud, rand(-128, innerWidth));
          draw(cloud, cloud.flip);
          clouds.push(cloud);
        }
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const COLOURS = ["purple", "pink", "orange", "blue"];
        const MAX_BUTTERFLIES = 7;
        const STEP = 1 / 60;
        let butterflies = [];
        const addButterfly = () => {
          const el = add("butterfly");
          const colour = COLOURS[Math.floor(rand(0, COLOURS.length))];
          el.style.backgroundImage = `url(../assets/butterfly-${colour}.png)`;
          const y = rand(0, innerHeight);
          butterflies.push({ el, x: rand(0, innerWidth), y, homeY: y, vx: 0, vy: 0, right: Math.random() < 0.5 });
        };
        // One sixtieth of a second of the home page's butterfly: mostly
        // hovering, now and then a dart somewhere else.
        const flutter = (b) => {
          const dice = Math.floor(rand(0, 51));
          if (dice === 1) {
            b.vx = rand(-450, 450);
            b.vy = rand(-400, 400);
          } else if (dice > 43) {
            b.vx = b.vy = 0;
          }
          b.vy += (400 / 3) * STEP;
          if (b.y >= b.homeY) b.vy = rand(-400, 0);
          b.x += b.vx * STEP;
          b.y += b.vy * STEP;
          if (b.vx !== 0) b.right = b.vx > 0;
        };

        let last = performance.now();
        let owed = 0;
        const frame = (now) => {
          const dt = Math.min((now - last) / 1000, 0.1);
          last = now;
          for (const cloud of clouds) {
            cloud.x += cloud.speed * dt;
            if (cloud.x > innerWidth) placeCloud(cloud, -128);
            draw(cloud, cloud.flip);
          }
          for (owed += dt; owed >= STEP; owed -= STEP) {
            if (butterflies.length < MAX_BUTTERFLIES && Math.random() < 1 / 150) addButterfly();
            butterflies.forEach(flutter);
          }
          const wings = Math.floor(now / 333) % 2;
          butterflies = butterflies.filter((b) => {
            if (b.x < -32 || b.x > innerWidth || b.y < -32 || b.y > innerHeight) {
              b.el.remove();
              return false;
            }
            b.el.style.backgroundPosition = `${-wings * 32}px ${b.right ? -32 : 0}px`;
            draw(b, 1);
            return true;
          });
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      })();
    </script>
