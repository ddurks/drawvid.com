<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balls Golf</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 5px;
        font-family: monospace;
      }

      #spinBar {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 20px;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid white;
        border-radius: 10px;
        overflow: hidden;
      }

      #spinFill {
        height: 100%;
        background: linear-gradient(90deg, blue, cyan);
        width: 0%;
        transition: width 0.1s;
      }

      #spinLabel {
        position: absolute;
        bottom: 55px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        font-size: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div id="ui">
      <div>Speed: <span id="speed">0.0</span> m/s</div>
      <div>Spin: <span id="spin">0.0</span></div>
      <div>Height: <span id="height">0.0</span> m</div>
      <div>Distance: <span id="distance">0.0</span> m</div>
    </div>

    <div id="spinLabel">← Swipe to add SPIN →</div>
    <div id="spinBar">
      <div id="spinFill"></div>
    </div>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Babylon.js Loaders -->
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- Havok Physics UMD -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <!-- Game Script -->
    <script src="game.js"></script>
  </body>
</html>
