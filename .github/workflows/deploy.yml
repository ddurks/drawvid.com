name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Keyless: GitHub's OIDC token assumes the drawvid-com-deploy role (no stored keys).
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::593615615124:role/drawvid-com-deploy
          aws-region: us-east-2

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://drawvid.com \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude ".DS_Store" \
            --exclude "tools/*" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.xml"

          # Sync HTML files with shorter cache (they change more often).
          # --delete here too, or a removed page stays in the bucket for good.
          aws s3 sync . s3://drawvid.com \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        run: |
          # Invalidate everything - simple and reliable
          aws cloudfront create-invalidation \
            --distribution-id E3OJPBXE0CZT17 \
            --paths "/*"

          echo "Invalidated all paths (/*)"
